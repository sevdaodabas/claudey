<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Claudey{% endblock %}</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #111827;
      --accent-orange: #f97316;
      --input-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      min-height: 100vh;
      background: var(--bg-dark);
      color: var(--text-main);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-panel {
      width: min(420px, 100%);
      background: var(--panel-bg);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--accent-orange);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 20px;
    }

    h1 { font-size: 22px; margin-bottom: 6px; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 22px; }

    label { display: block; color: #cbd5e1; font-size: 13px; margin: 14px 0 7px; }
    input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: white;
      font-size: 15px;
      outline: none;
      padding: 12px;
    }

    input:focus { border-color: var(--accent-orange); }

    .primary-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--accent-orange);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .links {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      font-size: 14px;
    }

    a { color: #fb923c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .errorlist {
      list-style: none;
      color: #fecaca;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.28);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin: 10px 0;
    }

    .helptext { display: block; color: var(--text-muted); font-size: 12px; margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>
  <main class="auth-panel">
    <div class="brand">
      <div class="brand-logo">C</div>
      <div>
        <h1>{% block heading %}{% endblock %}</h1>
        <p class="subtitle">Acıbadem Üniversitesi asistanı</p>
      </div>
    </div>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
