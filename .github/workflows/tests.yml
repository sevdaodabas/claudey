name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  django-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: claudey_db
          POSTGRES_USER: claudey_db
          POSTGRES_PASSWORD: claudeyy123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claudey_db -d claudey_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret
      DEBUG: "False"
      POSTGRES_NAME: claudey_db
      POSTGRES_USER: claudey_db
      POSTGRES_PASSWORD: claudeyy123
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: claudey/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
        working-directory: claudey

      - name: Run lint
        run: ruff check .
        working-directory: claudey

      - name: Run Django tests
        run: python manage.py test
        working-directory: claudey

      - name: Build Docker image
        run: docker build -t claudey-test ./claudey
